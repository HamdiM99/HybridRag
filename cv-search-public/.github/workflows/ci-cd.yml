name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: pip install ruff && ruff check src/ scripts/ tests/
      - name: Tests unitaires
        run: pytest -v

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image_name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Nom d'image en minuscules
        # GHCR exige un nom d'image en minuscules ; github.repository peut
        # contenir des majuscules selon le nom du dépôt/compte.
        id: image_name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image_name.outputs.image }}:latest

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && vars.AZURE_RESOURCE_GROUP != ''
    runs-on: ubuntu-latest
    # Ce job est ignoré (pas en échec) tant que les secrets Azure ne sont pas
    # configurés. Le déploiement peut très bien être fait manuellement (voir
    # infra/README.md) : seul build-and-push est nécessaire pour obtenir une
    # image utilisable, aucun secret Azure n'est requis pour cette partie.
    steps:
      - uses: actions/checkout@v4
      - name: Connexion Azure
        # Repli service principal + secret (pas d'OIDC) : un rôle limité
        # ne permet généralement pas de créer les role assignments
        # nécessaires à une fédération OIDC. À documenter comme limitation.
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Déploiement Bicep
        run: |
          az deployment group create \
            -g ${{ vars.AZURE_RESOURCE_GROUP }} \
            -f infra/main.bicep \
            -p infra/main.parameters.json \
            -p apimSubscriptionKey=${{ secrets.APIM_SUBSCRIPTION_KEY }} \
            -p containerImage=${{ needs.build-and-push.outputs.image }}:latest
